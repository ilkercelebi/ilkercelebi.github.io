<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Army Surge – Download</title>
<meta name="description" content="Army Surge: grow your army, crush the base. Free on App Store and Google Play.">
<meta property="og:title" content="Army Surge">
<meta property="og:description" content="Grow your army. Crush the base. Free on App Store & Google Play.">
<meta property="og:image" content="https://ilkercelebi.github.io/armysurge/icon.png">
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #0d1530; --card: #18244d; --gold: #ffd34d; --text: #ffffff; --muted: #b9c3e6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: radial-gradient(circle at 50% 20%, #24356f 0%, var(--bg) 70%); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 420px; text-align: center; }
  img.icon { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  h1 { font-size: 34px; margin: 18px 0 4px; letter-spacing: .5px; }
  p.tag { color: var(--gold); font-weight: 700; margin: 0 0 28px; }
  a.btn { display: block; padding: 16px; margin: 12px 0; border-radius: 16px; text-decoration: none;
          font-size: 19px; font-weight: 800; color: #0d1530; background: var(--gold); }
  a.btn.alt { background: #3ddc6a; }
  .social { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }
  .social a { color: var(--text); background: var(--card); padding: 10px 14px; border-radius: 12px;
              text-decoration: none; font-weight: 600; font-size: 15px; }
  p.handle { color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Army Surge icon">
  <h1>Army Surge</h1>
  <p class="tag">Grow your army. Crush the base.</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/army-surge/id6828423046">Download on the App Store</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.ilkercelebi.armysurge">Get it on Google Play</a>
  <div class="social">
    <a href="https://www.instagram.com/armysurgegame/">Instagram</a>
    <a href="https://www.tiktok.com/@armysurgegame">TikTok</a>
    <a href="https://www.facebook.com/armysurgegame">Facebook</a>
    <a href="https://www.youtube.com/@armysurgegame">YouTube</a>
  </div>
  <p class="handle">@armysurgegame</p>
</main>
<script>
  // Telefonda dogrudan magazaya; ?stay ile sayfada kalinir (masaustu her zaman sayfa).
  (function () {
    if (location.search.indexOf("stay") >= 0) return;
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    if (ios) location.replace(document.getElementById("ios").href);
    else if (android) location.replace(document.getElementById("android").href);
  })();
</script>
</body>
</html>
